# Nginx configuration for neosmart.kz and admin.neosmart.kz
# Uses wildcard SSL certificate *.neosmart.kz

# ========== ADMIN PANEL - admin.neosmart.kz ==========
server {
    listen 80;
    server_name admin.neosmart.kz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.neosmart.kz;

    # Wildcard SSL certificate
    ssl_certificate /etc/letsencrypt/live/neosmart.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neosmart.kz/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Proxy everything to admin-frontend container
    location / {
        proxy_pass http://classmate_admin_ui_prod:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
