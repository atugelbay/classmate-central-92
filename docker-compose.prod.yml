version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: classmate_central_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-classmate_central}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - neosmart-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: classmate_central_api_prod
    env_file: .env.prod
    environment:
      ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-secret}
      # Resend: RESEND_API_KEY и SMTP_FROM_EMAIL берутся из .env.prod (env_file выше)
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@neosmart.kz}
      FRONTEND_URL: https://app.neosmart.kz
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - neosmart-net

  # ============ ADMIN PANEL ============
  admin-backend:
    build:
      context: ./admin/backend
      dockerfile: Dockerfile
    container_name: classmate_admin_api_prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-classmate_central}
      MAIN_API_URL: http://backend:8080
      ADMIN_USERNAME: ${ADMIN_USERNAME:-superadmin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: https://admin.neosmart.kz
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - neosmart-net

  admin-frontend:
    build:
      context: ./admin/frontend
      dockerfile: Dockerfile
    container_name: classmate_admin_ui_prod
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - admin-backend
    restart: always
    networks:
      - neosmart-net

volumes:
  postgres_data_prod:

networks:
  neosmart-net:
    external: true
